name: Critical QEMU validation

on:
  pull_request:
    paths:
      - '.github/workflows/qemu-critical.yml'
      - 'tools/qemu_ci/**'
      - 'tools/qemu_artifact_smoke.py'
      - 'tests/qemu_ci/**'
      - 'tests/qemu_runner/**'
      - 'tests/qemu_artifact/**'
  workflow_run:
    workflows: ['Build iCopy-X IPK']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Completed Build iCopy-X IPK run ID to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qemu-${{ github.event.workflow_run.id || inputs.build_run_id || github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.8'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest tests/qemu_ci tests/qemu_runner -q

  identify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      head_sha: ${{ steps.build.outputs.head_sha }}
      build_ok: ${{ steps.build.outputs.build_ok }}
    env:
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # workflow_run uses trusted default-branch code. Manual dispatch is limited
      # by the runtime environment's branch policy. Never check out the PR here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: build
        run: python3 tools/qemu_ci/github_build.py identify --run-id "$BUILD_RUN_ID"
      - name: Mark the candidate head pending
        env:
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/qemu_ci/github_build.py status --run-id "$BUILD_RUN_ID" --state pending --url "$TARGET_URL"

  worker:
    needs: identify
    if: needs.identify.outputs.build_ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: critical-qemu-runtime
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install host worker dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap xvfb
      - name: Download the exact build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/qemu_ci/github_build.py download --run-id "$BUILD_RUN_ID" --output "$RUNNER_TEMP/ipks"
      - name: Fetch and verify the pinned private runtime
        env:
          QEMU_RUNTIME_HOST: ${{ vars.QEMU_RUNTIME_HOST }}
          QEMU_RUNTIME_USER: ${{ vars.QEMU_RUNTIME_USER }}
          QEMU_RUNTIME_KEY: ${{ secrets.QEMU_RUNTIME_KEY }}
          QEMU_RUNTIME_KNOWN_HOSTS: ${{ secrets.QEMU_RUNTIME_KNOWN_HOSTS }}
        run: python3 tools/qemu_ci/fetch_runtime.py "$RUNNER_TEMP/factory-runtime"
      - name: Run both IPKs in the offline worker
        run: |
          sudo python3 tools/qemu_ci/run_worker.py \
            --runtime "$RUNNER_TEMP/factory-runtime/runtime" \
            --artifacts "$RUNNER_TEMP/ipks" --output "$RUNNER_TEMP/qemu-run"
      - name: Retain bounded reports and build identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-qemu-evidence
          path: |
            ${{ runner.temp }}/qemu-run/evidence/
            ${{ runner.temp }}/ipks/build.json
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [identify, worker]
    if: always() && needs.identify.outputs.head_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish against the still-current build head
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          WORKER_RESULT: ${{ needs.worker.result }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$WORKER_RESULT" = success ]; then state=success; fi
          python3 tools/qemu_ci/github_build.py status --run-id "$BUILD_RUN_ID" --state "$state" --url "$TARGET_URL"
