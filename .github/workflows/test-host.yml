name: Host tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.8'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.8'
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements-host.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-host.txt
      - name: Validate workflow syntax and expressions
        if: runner.os == 'Linux' && matrix.python == '3.12'
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Run host suite
        env:
          # Keep legacy pytest off the shared /tmp/pytest-of-user namespace.
          PYTEST_ADDOPTS: --basetemp="${{ runner.temp }}/icopy-pytest"
        run: python -m pytest tests/ui tests/build tests/physical tests/release_ci tests/test_build_ipk_contracts.py --junitxml=host-test-results.xml
      - name: Check QEMU runner contracts (no emulation)
        if: runner.os == 'Linux'
        env:
          PYTEST_ADDOPTS: --basetemp="${{ runner.temp }}/icopy-qemu-contracts"
        run: python -m pytest tests/qemu_runner --junitxml=qemu-runner-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            host-test-results.xml
            qemu-runner-results.xml
          if-no-files-found: ignore
          retention-days: 14
