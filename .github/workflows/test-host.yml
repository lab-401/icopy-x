name: Host tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.8'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.8'
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements-host.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-host.txt
      - name: Run host suite
        run: python -m pytest tests/ui tests/build tests/test_build_ipk_contracts.py --junitxml=host-test-results.xml
      - name: Check QEMU runner contracts (no emulation)
        if: runner.os == 'Linux'
        run: python -m pytest tests/qemu_runner --junitxml=qemu-runner-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            host-test-results.xml
            qemu-runner-results.xml
          if-no-files-found: ignore
          retention-days: 14
